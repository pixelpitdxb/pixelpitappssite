<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PixelPit creates colorful and entertaining mobile games for iOS and Android.">
  <title>PixelPit — Mobile Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #10223d;
      background: linear-gradient(145deg, #dffaff, #8de8f2);
    }
    main {
      width: min(680px, 100%);
      padding: 56px 32px;
      text-align: center;
      background: rgba(255,255,255,.92);
      border: 3px solid #10223d;
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(16,34,61,.18);
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: -4px;
    }
    .accent { color: #12afc3; }
    p {
      margin: 20px auto 0;
      max-width: 520px;
      font-size: 1.15rem;
      line-height: 1.65;
    }
    footer {
      margin-top: 42px;
      font-size: .9rem;
      opacity: .65;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pixel<span class="accent">Pit</span></h1>
    <p>We create colorful, playful mobile games for iOS and Android.</p>
    <p>Our growing collection includes SortaClean, Duaaaa, Cannon Blast, and more.</p>
    <footer>© 2026 PixelPit. All rights reserved.</footer>
  </main>
</body>
</html>

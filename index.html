<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="PixelPit creates colorful and entertaining mobile games for iOS and Android."
  >

  <title>PixelPit — Mobile Games</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #10223d;
      --cyan: #26c8df;
      --cyan-light: #ddfaff;
      --cyan-medium: #8de8f2;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255, 255, 255, 0.85) 0 5%,
          transparent 5.5%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255, 255, 255, 0.55) 0 8%,
          transparent 8.5%
        ),
        linear-gradient(145deg, var(--cyan-light), var(--cyan-medium));
    }

    main {
      width: min(680px, 100%);
      padding: clamp(40px, 8vw, 64px) clamp(24px, 6vw, 44px);
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(16, 34, 61, 0.18);
    }

    .logo {
      display: block;
      width: min(380px, 88%);
      height: auto;
      margin: 0 auto 28px;
    }

    .intro {
      max-width: 520px;
      margin: 0 auto;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.65;
    }

    .games {
      margin: 34px 0 0;
      padding: 24px;
      background: var(--cyan-light);
      border: 2px solid var(--ink);
      border-radius: 20px;
    }

    .games h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    .games p {
      margin: 0;
      line-height: 1.7;
    }

    footer {
      margin-top: 38px;
      font-size: 0.9rem;
      opacity: 0.68;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      main {
        border-radius: 22px;
      }

      .games {
        padding: 20px 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="pixelpitblack.png"
      alt="PixelPit"
    >

    <p class="intro">
      We create colorful, playful mobile games for iOS and Android.
    </p>

    <section class="games" aria-labelledby="games-title">
      <h1 id="games-title">Our Games</h1>
      <p>SortaClean · Duaaaa · Cannon Blast</p>
      <p>More games are on the way.</p>
    </section>

    <footer>
      © 2026 PixelPit. All rights reserved.
    </footer>
  </main>
</body>
</html>
